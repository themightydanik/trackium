services:
  gateway:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: trackium
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: trackium
      # No password interpolation in a URI: symbols such as @, / and # are valid.
      DATABASE_URL: postgres://db/trackium
      TCP_PORT: 9000
      HTTP_PORT: 8080
      ENABLE_WEB_WORKSPACE: ${ENABLE_WEB_WORKSPACE:-false}
      ENABLE_NATIVE_CLIENTS: ${ENABLE_NATIVE_CLIENTS:-false}
      ENABLE_SERVER_SIMULATOR: ${ENABLE_SERVER_SIMULATOR:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:8080}
      WEB_ROOT: /opt/trackium-ui
      PROOF_MODE: ${PROOF_MODE:-disabled}
      ENABLE_FIXTURE_ADAPTER: ${ENABLE_FIXTURE_ADAPTER:-false}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 7s
      retries: 3
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trackium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trackium
    volumes:
      - gateway-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackium -d trackium"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  gateway-db:
