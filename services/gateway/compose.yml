services:
  gateway:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://trackium:${POSTGRES_PASSWORD}@db:5432/trackium
      TCP_PORT: 9000
      HTTP_PORT: 8080
    ports:
      - "9000:9000"
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trackium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: trackium
    volumes:
      - gateway-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackium -d trackium"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  gateway-db:
