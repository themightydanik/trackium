worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events {
    worker_connections 64;
}
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 8s;
    keepalive_timeout 0;
    client_max_body_size 8k;
    client_body_buffer_size 8k;
    limit_conn_zone $server_name zone=routing_conn:1m;
    limit_req_zone $server_name zone=routing_rate:1m rate=8r/s;

    # Use the original URI, including query, before sending anything upstream.
    map "$request_method $request_uri" $routing_allowed {
        default 0;
        "~^GET /status$" 1;
        "~^POST /route$" 1;
    }
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream attestor {
        zone attestor 64k;
        server valhalla:8002 resolve max_conns=4;
    }
    server {
        listen 8443 ssl default_server;
        server_name trackium-oracle-routing;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /pki/server.crt;
        ssl_certificate_key /pki/server.key;
        ssl_client_certificate /pki/gateway-ca.crt;
        ssl_verify_client on;
        ssl_session_cache off;
        ssl_session_tickets off;
        limit_conn routing_conn 6;
        limit_req zone=routing_rate burst=8 nodelay;

        location / {
            if ($routing_allowed = 0) { return 404; }
            proxy_http_version 1.1;
            proxy_set_header Connection close;
            proxy_set_header Host valhalla;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_connect_timeout 1s;
            proxy_send_timeout 8s;
            proxy_read_timeout 8s;
            proxy_next_upstream off;
            proxy_buffering off;
            proxy_pass http://attestor;
        }
    }
}
