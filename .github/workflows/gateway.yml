name: Gateway deployment checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/gateway/**'
      - '.railway/**'
      - 'docs/RAILWAY_DEPLOYMENT.md'
      - '.github/workflows/gateway.yml'
  push:
    branches: [main]
    paths:
      - 'services/gateway/**'
      - '.railway/**'
      - '.github/workflows/gateway.yml'

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trackium
          POSTGRES_DB: trackium_test
          # Ephemeral CI database only; never use this example for a deployment.
          POSTGRES_PASSWORD: ci-only-not-a-deployment-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trackium -d trackium_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://trackium:ci-only-not-a-deployment-secret@127.0.0.1:5432/trackium_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
        working-directory: services/gateway
      - run: npm test
        working-directory: services/gateway
      - run: npm run test:integration
        working-directory: services/gateway
      - run: npm ci
        working-directory: .railway
      - run: npm run check && npm test
        working-directory: .railway
      - run: node --test tests/minidapp/core.test.cjs
