name: Android Debug APK

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Test and assemble installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: apps/android
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36 and build-tools 35.0.0
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK must be preinstalled on ubuntu-24.04}"
          printf 'y\\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'

      - name: Run Android unit tests and assemble debug APK
        run: |
          set -euo pipefail
          # Retry transient Gradle distribution/download errors (e.g. GitHub 504).
          for attempt in 1 2 3 4; do
            if ./gradlew --no-daemon :app:testDebugUnitTest :minimaapi:testDebugUnitTest :app:assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Android build failed after four attempts; inspect the Gradle logs."
              exit 1
            fi
            echo "::warning::Gradle failed (attempt $attempt); retrying after transient network failure."
            sleep $((attempt * 15))
          done

      - name: Verify APK and record source and checksum
        run: |
          set -euo pipefail
          mkdir -p build/ci-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build/ci-artifacts/trackium-cargo-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/ci-artifacts/trackium-cargo-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/ci-artifacts/trackium-cargo-debug.apk > build/ci-artifacts/APK_BADGING.txt
          grep -q "^package: name='tech.trackium.cargo' " build/ci-artifacts/APK_BADGING.txt
          grep -qx "sdkVersion:'28'" build/ci-artifacts/APK_BADGING.txt
          grep -qx "targetSdkVersion:'36'" build/ci-artifacts/APK_BADGING.txt
          source_commit="$(git rev-parse HEAD)"
          cd build/ci-artifacts
          sha256sum trackium-cargo-debug.apk > SHA256SUMS
          {
            printf 'Trackium Android debug evaluation build\n\nSource commit: %s\n' "$source_commit"
            printf 'Package: tech.trackium.cargo\nminSdk: 28 (Android 9)\ntargetSdk: 36\n'
            printf 'JDK: 21\nAndroid SDK: 36\nBuild tools: 35.0.0\n\n'
            cat SHA256SUMS
            printf '\nDebug signed; no real wallet or Mainnet tests.\n'
            printf 'Install: extract the ZIP, open trackium-cargo-debug.apk on Android 9+, allow installation for that file manager/browser.\n'
            printf 'BlackBear 2.2.10 and Core Apps Enable + ADMIN are configured separately.\n'
            printf 'Use only trusted enabled Core apps and one wallet instance. Live/Mainnet stay off by default.\n'
            printf 'Debug signing identity may differ between runs; do not uninstall/clear an app with unresolved publication state to force an update.\n'
          } > BUILD_INFO.txt
          {
            printf '### Trackium Android debug artifact\n\n```text\n'
            cat BUILD_INFO.txt
            printf '\n```\n\nDownload **trackium-android-debug** from this run’s Artifacts section.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable APK and build identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trackium-android-debug
          path: apps/android/build/ci-artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
