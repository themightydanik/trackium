name: Trackium Lite Android Debug APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/lite-android/**'
      - 'docs/MINIMA_LIVE_DEMO_D3.md'
      - 'assets/v2/**'
      - '.github/workflows/lite-android-debug.yml'
      - 'apps/android/gradle/wrapper/**'
      - 'apps/android/gradlew'

permissions:
  contents: read

concurrency:
  group: lite-android-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lite-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Android SDK
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?}"
          printf 'y\n' | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'

      - name: Test and build isolated Lite APK
        run: |
          set -euo pipefail
          chmod +x apps/android/gradlew
          apps/android/gradlew -p apps/lite-android --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Verify installable APK and checksum
        run: |
          set -euo pipefail
          mkdir -p dist/lite-android
          cp apps/lite-android/app/build/outputs/apk/debug/app-debug.apk dist/lite-android/trackium-lite-debug.apk
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/lite-android/trackium-lite-debug.apk > dist/lite-android/SIGNATURE.txt
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging dist/lite-android/trackium-lite-debug.apk > dist/lite-android/APK_BADGING.txt
          grep -q "^package: name='tech.trackium.lite' " dist/lite-android/APK_BADGING.txt
          (cd dist/lite-android && sha256sum trackium-lite-debug.apk > SHA256SUMS)
          printf 'Source commit: %s\nDebug signed: runner-specific key\nThis APK has NOT passed live account/physical phone acceptance.\n' "$(git rev-parse HEAD)" > dist/lite-android/BUILD_INFO.txt

      - name: Upload review APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trackium-lite-android-debug
          path: dist/lite-android/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Run shell instrumentation on a disposable offline emulator
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chown "$USER" /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/lite-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" 'emulator' 'platform-tools' 'system-images;android-34;default;x86_64'
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          command -v adb
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n LiteReview -k 'system-images;android-34;default;x86_64' -d pixel
          "$ANDROID_HOME/emulator/emulator" -avd LiteReview -no-window -no-audio -no-snapshot \
            -no-metrics -gpu swiftshader_indirect > "$RUNNER_TEMP/lite-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then tail -100 "$RUNNER_TEMP/lite-emulator.log"; fi; kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 90 adb wait-for-device
          timeout 150 sh -ec 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb shell cmd connectivity airplane-mode enable
          adb shell svc wifi disable
          adb install dist/lite-android/trackium-lite-debug.apk
          adb install apps/lite-android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w -r -e offlineEmulator true \
            tech.trackium.lite.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/lite-instrumentation.txt"
          grep -Fq 'OK (2 tests)' "$RUNNER_TEMP/lite-instrumentation.txt"
